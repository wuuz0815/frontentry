<!doctype html>
<!--
  Datei:  index.html
  Zweck:  Oberfläche der Tor-Steuerung (Shelly 1 Gen3 per Bluetooth)
  Autor:  Stefan Weinzetl
-->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d3b2f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Tor öffnen</title>
  <style>
    :root {
      --hg: #f3f1ec; --text: #1b1f1d; --leise: #5d6661;
      --tor: #1d3b2f; --tor-text: #ffffff; --ok: #2f8a4c; --fehler: #b3261e; --warnung: #8a5a00;
      --flaeche: #ffffff; --rand: #d9d5cc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --hg: #121614; --text: #e8ebe9; --leise: #9aa39e;
        --tor: #3f7a5f; --ok: #4cb36d; --fehler: #f2827a; --warnung: #e0b04f;
        --flaeche: #1c211f; --rand: #333a36;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--hg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center;
    }
    main {
      width: 100%; max-width: 420px; min-height: 100%;
      padding: max(24px, env(safe-area-inset-top)) 16px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 20px;
    }
    h1 { margin: 8px 0 0; font-size: 1.1rem; font-weight: 600; color: var(--leise); letter-spacing: .04em; }
    .tor {
      margin-top: 6vh;
      width: min(72vw, 280px); aspect-ratio: 1; border-radius: 50%;
      border: none; background: var(--tor); color: var(--tor-text);
      font-size: 1.6rem; font-weight: 700;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
      transition: transform .12s ease, background .25s ease;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    .tor:active { transform: scale(.96); }
    .tor:disabled { opacity: .85; }
    .tor[data-zustand="laeuft"] { animation: puls 1.1s ease-in-out infinite; }
    .tor[data-zustand="ok"] { background: var(--ok); }
    @keyframes puls { 50% { transform: scale(.97); opacity: .8; } }
    #status { min-height: 3em; text-align: center; font-size: 1.05rem; margin: 0; }
    #status[data-art="ok"] { color: var(--ok); font-weight: 600; }
    #status[data-art="fehler"] { color: var(--fehler); }
    #status[data-art="warnung"] { color: var(--warnung); }
    .karte {
      width: 100%; background: var(--flaeche); border: 1px solid var(--rand);
      border-radius: 12px; padding: 14px;
    }
    .karte label { display: block; font-size: .9rem; color: var(--leise); margin-bottom: 6px; }
    input[type=password] {
      width: 100%; padding: 12px; font-size: 1rem; border-radius: 8px;
      border: 1px solid var(--rand); background: var(--hg); color: var(--text);
    }
    .knopf {
      margin-top: 10px; width: 100%; padding: 12px; font-size: 1rem; border-radius: 8px;
      border: 1px solid var(--rand); background: var(--hg); color: var(--text);
    }
    .knopf.haupt { background: var(--tor); color: var(--tor-text); border-color: var(--tor); }
    details { width: 100%; margin-top: auto; }
    summary { color: var(--leise); font-size: .9rem; cursor: pointer; }
    pre {
      white-space: pre-wrap; word-break: break-word; font-size: .72rem;
      max-height: 220px; overflow: auto; color: var(--leise);
    }
    footer { font-size: .75rem; color: var(--leise); }
  </style>
</head>
<body>
  <main>
    <h1>TOR</h1>
    <button id="btnTor" class="tor" type="button">Tor öffnen</button>
    <p id="status" role="status" aria-live="polite">Bereit</p>

    <section id="einrichtung" class="karte" hidden>
      <label for="passwort">Gerätepasswort des Shelly</label>
      <input id="passwort" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="btnPasswortUebernehmen" class="knopf haupt" type="button">Übernehmen</button>
    </section>

    <details id="details">
      <summary>Einstellungen und Protokoll</summary>
      <div class="karte">
        <button id="btnPasswortSetzen" class="knopf" type="button">Passwort neu eingeben</button>
        <button id="btnGeraetNeu" class="knopf" type="button">Anderes Gerät wählen</button>
        <button id="btnZuruecksetzen" class="knopf" type="button">Alle gespeicherten Daten löschen</button>
        <pre id="log"></pre>
      </div>
    </details>
    <footer>Version <span id="version"></span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
